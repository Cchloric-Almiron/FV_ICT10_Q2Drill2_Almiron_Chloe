<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT SW1</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background-color:rgb(56, 0, 0);
        }

        #TitleBox{
            text-align: center;
            background-color: rgb(83, 0, 0);
            padding:35px;
            border-left: 20px solid rgba(109, 0, 0, 0.751);
            color: white;
            font-family:Georgia, 'Times New Roman', Times, serif;
            
        }

        #MainBox{
            text-align: center;
            background-color: rgb(83, 0, 0);
            padding: 40px;
            margin-top: 30px;
            color:white;
            width:500px;
            margin-left: auto;
            margin-right: auto;
            border-left:22px solid rgba(109, 0, 0, 0.751);
            font-family:Georgia, 'Times New Roman', Times, serif;

        }

        #output1{
            text-align:center;
            justify-content: center;
            background-color: rgb(83, 0, 0);
            padding: 20px;
            margin: 20px;
            color: white;
            width: 500px;
            height:600px;
            margin-left: auto;  
            margin-right: auto;
            border-left: 22px solid rgba(109, 0, 0, 0.751);
            font-family:Gill Sans, 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;

        }

        #LastName{
            background-color:rgb(255, 226, 226);
            border-radius:30px;
            width:300px;
            border:rgb(255, 226, 226);
            padding:8px;
            box-shadow:2px 2px 2px pink;
            font-family:Gill Sans, 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        #FirstName{
            background-color:rgb(255, 226, 226);
            border-radius:30px;
            width:300px;
            border:rgb(255, 226, 226);
            padding:8px;
            box-shadow:2px 2px 2px pink;
            font-family:Gill Sans, 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        .btn{
            width:100px;
            font-family:Gill Sans, 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
    </style>
</head>
<body>

    <div id="TitleBox">
        <h1>Add a new member!!</h1>
    </div>

    <div id="MainBox">
    <h2>Enter the student's details</h2>
    <br>
    <form>

        <input type="text" id="Fname" placeholder = "First Name" required>
        <br><br>
        <input type="text" id="Lname" placeholder = "Last Name" required>
        <hr>

        <input type="button" py-click="check_me" value="Check" class="btn btn-success">
        <input type="button" onclick="window.location.reload()" value="Cancel" class="btn btn-danger">
    </form>

    </div>

    <div id="output1">
         <script type="py" src="main.py"></script>
    </div>
    
</body>
</html>
